name: Daily Farmer Assistant Jobs

on:
  schedule:
    # Runs every day at 5:30 AM IST (00:00 UTC)
    - cron: "0 0 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

jobs:
  daily-jobs:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # 1. Wake up the Render backend
      # ---------------------------------------------------
      - name: Wake up Render backend
        run: |
          echo "Waking up Render backend..."

          curl -sS --max-time 30 \
            "${{ secrets.BACKEND_URL }}/health" || true

      # ---------------------------------------------------
      # 2. Wait until backend is actually ready
      # ---------------------------------------------------
      - name: Wait for backend to become ready
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            echo "Health check attempt $i/30..."

            if curl -fsS --max-time 20 \
              "${{ secrets.BACKEND_URL }}/health"; then

              echo ""
              echo "Backend is ready!"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend did not become ready in time."
              exit 1
            fi

            echo "Backend not ready yet. Waiting 20 seconds..."
            sleep 20
          done

      # ---------------------------------------------------
      # 3. Run the daily jobs
      # ---------------------------------------------------
      - name: Trigger daily market sync and farmer reports
        run: |
          echo "Starting daily jobs..."

          curl -fS \
            --connect-timeout 30 \
            --max-time 3600 \
            -X POST \
            "${{ secrets.BACKEND_URL }}/cron/run-daily-jobs" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

          echo ""
          echo "Daily jobs completed successfully."